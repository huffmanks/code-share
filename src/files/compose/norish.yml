services:
  norish:
    image: norishapp/norish:latest
    container_name: norish-app
    restart: always
    ports:
      - "3009:3000"
    volumes:
      - norish_data:/app/uploads
    environment:
      AUTH_URL: ${AUTH_URL}
      DATABASE_URL: ${DATABASE_URL}
      MASTER_KEY: ${MASTER_KEY}
      VALKEY_URL: ${VALKEY_URL}
      OBSCURA_ENDPOINT: ${OBSCURA_ENDPOINT}
      OBSCURA_CDP_TOKEN: ${OBSCURA_CDP_TOKEN}
      UPLOADS_DIR: ${UPLOADS_DIR}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE}
      ENABLED_LOCALES: ${ENABLED_LOCALES}
      PASSWORD_AUTH_ENABLED: ${PASSWORD_AUTH_ENABLED}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:3000'' + ''/api/v1/health/live'', r => process.exit(r.statusCode===200?0:1))"',
        ]
      interval: 1m
      timeout: 15s
      retries: 3
      start_period: 1m
    depends_on:
      - db
      - valkey

  db:
    image: postgres:17-alpine
    container_name: norish-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data

  obscura:
    image: norishapp/obscura:0.2.5-norish.1
    container_name: norish-obscura
    restart: unless-stopped
    environment:
      OBSCURA_CDP_TOKEN: ${OBSCURA_CDP_TOKEN}

  valkey:
    image: valkey/valkey:9
    container_name: norish-valkey
    restart: unless-stopped
    volumes:
      - valkey_data:/data

volumes:
  db_data:
  norish_data:
  valkey_data: