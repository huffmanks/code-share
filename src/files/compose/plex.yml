services:
  plex:
    image: plexinc/pms-docker:latest
    container_name: plex
    network_mode: host
    volumes:
      - ./config:/config
      - /path/to/tvseries:/tv
      - /path/to/movies-01:/movies/movies-01
      - /path/to/movies-02:/movies/movies-02
      - /path/to/youtube:/youtube
    environment:
      - TZ={{TIME_ZONE_VAR}}
      - PLEX_CLAIM= #optional
    restart: unless-stopped
