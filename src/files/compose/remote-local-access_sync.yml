services:
  adguard:
    image: adguard/adguardhome
    container_name: adguard
    restart: unless-stopped
    volumes:
      - ./adguard/work:/opt/adguardhome/work
      - ./adguard/conf:/opt/adguardhome/conf
    network_mode: host

  adguardhome-sync:
    image: ghcr.io/bakito/adguardhome-sync:latest
    container_name: adguardhome-sync
    command: run
    environment:
      ORIGIN_URL: ${ORIGIN_URL}
      ORIGIN_USERNAME: ${ORIGIN_USERNAME}
      ORIGIN_PASSWORD: ${ORIGIN_PASSWORD}
      REPLICA_URL: ${REPLICA_URL}
      REPLICA_USERNAME: ${REPLICA_USERNAME}
      REPLICA_PASSWORD: ${REPLICA_PASSWORD}
      CRON: "*/10 * * * *"
      RUN_ON_START: "true"

  npm:
    image: "jc21/nginx-proxy-manager:latest"
    container_name: npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt
    environment:
      - DB_SQLITE_FILE=/data/database.sqlite

  keepalived:
    image: osixia/keepalived:latest
    container_name: keepalived
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    environment:
      - KEEPALIVED_STATE=MASTER # MASTER | BACKUP
      - KEEPALIVED_INTERFACE=enp3s0 # eth0 | enp3s0 | wlan0
      - KEEPALIVED_VIRTUAL_ROUTER_ID=51
      - KEEPALIVED_PRIORITY=101
      - KEEPALIVED_UNICAST_PEERS={{CLIENT_IP_VAR}} # Peers/other devices
      - KEEPALIVED_VIRTUAL_IPS={{VIRTUAL_IP_VAR}}/24
      - KEEPALIVED_PASSWORD=${KEEPALIVED_PASSWORD}
