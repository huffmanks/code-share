# Source (Primary NPM instance running locally)
source:
  host: "http://npm:81"
  username: "primary@example.com"
  password: "your_primary_npm_password"

# Destinations (Fallback NPM instance on second device)
destinations:
  - host: "http://192.168.x.x:81"
    username: "secondary@example.com"
    password: "your_secondary_npm_password"

interval_hours: 1
mirror: true # Deletes hosts on destination that were removed from primary
dry_run: false # Set to 'true' first if you want to test without modifying
log_level: "info" # Options: debug | info | warning | error
